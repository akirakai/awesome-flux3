name: Collect FLUX.3 videos

on:
  schedule:
    # Run away from the top of the hour to reduce scheduled-run congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flux3-hourly-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect recent posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FLUX3_QUERY: ${{ vars.FLUX3_QUERY }}
          FLUX3_MIN_SCORE: ${{ vars.FLUX3_MIN_SCORE }}
          FLUX3_MAX_RESULTS: ${{ vars.FLUX3_MAX_RESULTS }}
        run: python scripts/collect_x.py

      - name: Commit updated catalog
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "flux3-collector[bot]"
          git config user.email "flux3-collector[bot]@users.noreply.github.com"
          git add CATALOG.md data/videos.json data/state.json
          git commit -m "chore: collect new FLUX.3 videos"
          git push
